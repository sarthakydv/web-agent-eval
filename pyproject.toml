[project]
name = "web-agent-eval"
version = "0.1.0"
description = "A web agent measured on REAL's deterministic site replicas"
readme = "README.md"

# agisdk itself allows >=3.9, but it pulls numpy, gymnasium and lxml, which lag
# new interpreters. System Python here is 3.14.6 and was not trusted for that
# reason. 3.12 is pinned deliberately — see docs/DECISIONS.md.
requires-python = ">=3.12,<3.13"

dependencies = [
    "agisdk>=0.3.5",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is not installed into the venv (no build-system table), so tests
# reach the package through the source tree.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
